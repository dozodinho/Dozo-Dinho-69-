<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dozo Dinho Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .signup-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .signup-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .signup-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="signup-header">
            <h1>Create Account</h1>
            <p>Join Dozo Dinho Academy today</p>
        </div>

        <div id="message" class="message"></div>

        <form id="signupForm" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required>
            </div>

            <button type="submit" class="signup-btn" id="btn">Create Account</button>
        </form>

        <div class="signup-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>

    <script>
        const config = {
            apiKey: "AIzaSyCtEe61VFzO6yymnRDIY6VUZaJv7Z2UrJE",
            authDomain: "dozo-dinho-academy.firebaseapp.com",
            projectId: "dozo-dinho-academy",
            storageBucket: "dozo-dinho-academy.firebasestorage.app",
            messagingSenderId: "643133250547",
            appId: "1:643133250547:web:242e6b96c48b4b49e15086"
        };

        firebase.initializeApp(config);
        const auth = firebase.auth();

        function handleSubmit(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const msg = document.getElementById('message');
            const btn = document.getElementById('btn');

            if (password !== confirm) {
                msg.textContent = 'Passwords do not match!';
                msg.className = 'message show error';
                return false;
            }

            if (password.length < 6) {
                msg.textContent = 'Password must be at least 6 characters!';
                msg.className = 'message show error';
                return false;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';
            msg.textContent = '';
            msg.className = 'message';

            auth.createUserWithEmailAndPassword(email, password)
                .then(function(result) {
                    msg.textContent = 'Success! Redirecting to dashboard...';
                    msg.className = 'message show success';
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                })
                .catch(function(error) {
                    msg.textContent = error.message;
                    msg.className = 'message show error';
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                });

            return false;
        }
    </script>
</body>
</html>
